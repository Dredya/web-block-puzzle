<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b18" />
  <meta name="description" content="Block Blast — a colorful 8×8 block puzzle game built with vanilla HTML, CSS and JavaScript." />
  <title>Block Blast — Puzzle Game</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1024'/%3E%3Crect x='10' y='10' width='20' height='20' rx='5' fill='%23a78bfa'/%3E%3Crect x='34' y='10' width='20' height='20' rx='5' fill='%2367e8f9'/%3E%3Crect x='10' y='34' width='20' height='20' rx='5' fill='%23f472b6'/%3E%3Crect x='34' y='34' width='20' height='20' rx='5' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="hud">
      <div class="hud-top">
        <h1 class="logo">
          <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="logo-text">BLOCK<span class="logo-accent">BLAST</span></span>
        </h1>
        <div class="hud-actions">
          <button class="icon-btn" id="soundBtn" type="button" aria-label="Mute sound" aria-pressed="false" title="Mute sound (M)">
            <svg class="icon icon-sound" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4V5Z" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7" />
              <path d="M18.5 5.5a9 9 0 0 1 0 13" />
            </svg>
            <svg class="icon icon-muted" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4V5Z" />
              <path d="m16 9 5 6" />
              <path d="m21 9-5 6" />
            </svg>
          </button>
          <button class="icon-btn" id="restartBtn" type="button" aria-label="Restart game" title="Restart game (R)">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 2.64-6.36" />
              <path d="M3 4v5h5" />
            </svg>
          </button>
        </div>
      </div>

      <div class="hud-scores">
        <div class="score-card main">
          <span class="score-label">SCORE</span>
          <strong class="score-value" id="scoreValue">0</strong>
        </div>
        <div class="score-card">
          <span class="score-label">BEST</span>
          <strong class="score-value" id="bestValue">0</strong>
        </div>
      </div>
    </header>

    <main class="board-area" id="boardArea">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" role="group" aria-label="8 by 8 game board" aria-describedby="gameInstructions"></div>
        <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>
      </div>
    </main>

    <section class="tray-wrap">
      <div class="tray" id="tray" role="group" aria-label="Piece tray — drag a piece onto the board"></div>
    </section>
  </div>

  <div class="overlay" id="gameOverOverlay" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <div class="overlay-glow" aria-hidden="true"></div>
      <h2 class="overlay-title" id="gameOverTitle">Game Over</h2>
      <p class="final-label">Final Score</p>
      <p class="final-score" id="finalScore">0</p>
      <p class="final-best" id="finalBest">Best: 0</p>
      <button class="primary-btn" id="playAgainBtn" type="button">Play Again</button>
    </div>
  </div>

  <div class="drag-layer" id="dragLayer" aria-hidden="true"></div>
  <div class="sr-only" aria-live="polite" id="liveRegion"></div>
  <p class="sr-only" id="gameInstructions">
    Drag a block piece from the tray onto empty squares of the 8 by 8 board. Complete a row or
    column to clear it. Use the restart button or the R key to start over, and the sound button or
    the M key to mute.
  </p>

  <noscript>
    <p class="noscript">Block Blast needs JavaScript enabled to run.</p>
  </noscript>

  <script src="script.js" defer></script>
</body>
</html>
